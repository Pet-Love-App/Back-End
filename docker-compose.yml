# Docker Compose for Pet Love Backend (腾讯云 SSL 证书)
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pet_love_backend
    restart: unless-stopped
    command: gunicorn back_end.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile - --error-logfile -
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - ./logs:/app/logs
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=back_end.settings
    networks:
      - pet_love_network

  nginx:
    image: nginx:alpine
    container_name: pet_love_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro # 腾讯云证书目录
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
    depends_on:
      - web
    networks:
      - pet_love_network

networks:
  pet_love_network:
    driver: bridge

volumes:
  staticfiles:
  media:
  logs:
