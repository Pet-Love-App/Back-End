# Docker Compose for Pet Love Backend (Supabase)
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pet_love_backend
    restart: unless-stopped
    command: gunicorn back_end.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile - --error-logfile -
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=back_end.settings
    networks:
      - pet_love_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/auth/login/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  pet_love_network:
    driver: bridge

volumes:
  staticfiles:
  media:
  logs:
