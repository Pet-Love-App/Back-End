# 项目配置
[tool.poetry]
name = "back-end"
version = "0.1.0"
description = "Django Backend API"
authors = ["yuanqh yuanqh23@mails.tsinghua.edu.cn"]
readme = "README.md"
packages = [{ include = "back_end" }, { include = "additive" }, { include = "ai_report" }]

# 生产依赖
[tool.poetry.dependencies]
python = "^3.11"
django = "^5.2.0"
djangorestframework = "^3.15.0"
django-cors-headers = "^4.3.0"

# 开发依赖
# poetry install --only=main只安装生产依赖
requests = "^2.32.5"
pymysql = "^1.1.2"
jq = "^1.10.0"
[tool.poetry.group.dev.dependencies]
ruff = "^0.8.0"
pytest = "^8.0.0"
pytest-django = "^4.7.0"

# Ruff 配置
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501", # ignore line too long check
    "F401"
]

# ruff import排序
# 标准库 → 第三方库 → 项目内部包
[tool.ruff.lint.isort]
known-first-party = ["back_end", "additive", "ai_report"]

# Pytest 配置
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "back_end.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
