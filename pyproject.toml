# 项目配置
[tool.poetry]
name = "pet-love-backend"
version = "2.0.0"
description = "Pet Love Backend API with Supabase"
authors = ["yuanqh yuanqh23@mails.tsinghua.edu.cn"]
readme = "README.md"
packages = [
    { include = "api" },
    { include = "services" },
    { include = "utils" },
]

# 生产依赖
[tool.poetry.dependencies]
python = "^3.10"
django = "^5.2.0"
django-cors-headers = "^4.3.0"
gunicorn = "^21.2.0"
python-dotenv = "^1.0.0"
# Supabase
supabase = "^2.0.0"
# OCR
paddleocr = "^2.7.0"
paddlepaddle = "^2.6.0"
opencv-contrib-python = "^4.10.0"
numpy = "^1.26.0"
pillow = "^10.0.0"
# 其他
requests = "^2.32.0"
pydantic = { extras = ["email"], version = "^2.0.0" }

# 开发依赖
[tool.poetry.group.dev.dependencies]
ruff = "^0.8.0"
pytest = "^8.0.0"
pytest-django = "^4.7.0"
black = "^24.0.0"

# Ruff 配置
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501", # ignore line too long check
    "F401", # ignore unused imports
]

# ruff import排序
[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "services",
    "utils",
    "config",
    "middleware",
    "back_end",
]

# Pytest 配置
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "back_end.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
